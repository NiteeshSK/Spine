# Phase 1 - QLoRA SFT on a single 40/80 GB A100.
# ~6k examples, 3 epochs, effective batch 16, ~2.5 GPU-hours on an A100-40GB.
run_name: spine-sft-qwen3-8b
output_dir: runs/sft
seed: 42

model:
  base: Qwen/Qwen3-8B
  load_in_4bit: true            # NF4 + double quant -> base weights ~5.5 GB

lora:
  r: 32
  alpha: 64                     # alpha = 2r is a sane default; scaling is alpha/r
  dropout: 0.05
  # All attention + MLP projections. Attention-only (q,v) trains faster but
  # underfits the closed-vocabulary enums; the MLP is where the schema lives.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train: data/sft/train.jsonl
  val: data/sft/val.jsonl
  probe: data/sft/val.jsonl     # raw-format rows for the generation probe
  max_train: 0                  # 0 = use everything; set for the scaling ablation

train:
  epochs: 3
  batch_size: 4
  grad_accum: 4                 # effective batch = 16
  learning_rate: 2.0e-4         # LoRA tolerates ~100x the full-FT LR
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_seq_len: 1536
  packing: false                # packing would blur the prompt/completion boundary
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  probe_every: 100              # generation probe cadence (slow; keep it coarse)
  probe_size: 64
  load_best_model_at_end: true
  report_to: [none]             # set to [wandb] if you want hosted curves
