# CPU smoke test. A 135M model, 200 examples, ~3 minutes on a laptop.
# It will NOT learn the task. It proves the code path end to end before you
# rent a GPU: data loads, loss is masked, callbacks fire, adapter saves.
run_name: spine-sft-smoke
output_dir: runs/smoke
seed: 42

model:
  base: HuggingFaceTB/SmolLM2-135M-Instruct
  load_in_4bit: false

lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  train: data/sft/train.jsonl
  val: data/sft/val.jsonl
  probe: data/sft/val.jsonl
  max_train: 200

train:
  epochs: 1
  batch_size: 1
  grad_accum: 4
  learning_rate: 2.0e-4
  max_seq_len: 768
  bf16: false
  gradient_checkpointing: false
  optim: adamw_torch
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  probe_every: 50
  probe_size: 8
  load_best_model_at_end: false
  report_to: [none]
