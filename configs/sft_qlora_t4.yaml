# Phase 1 on a free Colab T4 (16 GB, no bf16). Smaller base, fp16, shorter seqs.
# Same code path, same metrics -- only the compute envelope changes.
run_name: spine-sft-qwen25-1_5b-t4
output_dir: runs/sft_t4
seed: 42

model:
  base: Qwen/Qwen2.5-1.5B-Instruct
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train: data/sft/train.jsonl
  val: data/sft/val.jsonl
  probe: data/sft/val.jsonl
  max_train: 0

train:
  epochs: 3
  batch_size: 2
  grad_accum: 8
  learning_rate: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  max_seq_len: 1024
  packing: false
  bf16: false                   # T4 is Turing: no bf16
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  probe_every: 200
  probe_size: 32
  report_to: [none]
