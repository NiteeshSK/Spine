# Phase 2 - DPO on preference pairs mined from the SFT model's own samples.
# Learning rate is ~20x lower than SFT: DPO is a nudge, not a re-teach.
run_name: spine-dpo-t4
output_dir: runs/dpo_t4
seed: 42

model:
  base: Qwen/Qwen2.5-1.5B-Instruct
  sft_adapter: runs/sft_t4/adapter   # policy continues the SFT adapter
  load_in_4bit: true

data:
  pairs: data/dpo/pairs.jsonl
  val_fraction: 0.05

train:
  beta: 0.1                      # KL leash. Raise to 0.3-0.5 if rewards collapse.
  loss_type: sigmoid             # try ipo / kto_pair in the ablation
  label_smoothing: 0.0           # cDPO: set 0.05-0.1 if your preference labels are noisy
  epochs: 1                      # DPO overfits fast; 1 epoch is usually right
  batch_size: 2
  grad_accum: 8
  learning_rate: 5.0e-6
  scheduler: cosine
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  max_length: 1536
  max_prompt_length: 1024
  bf16: false
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  logging_steps: 5
  eval_steps: 50
  save_steps: 100
  report_to: [none]

# Trips when the policy starts down-weighting the chosen response too -- the
# signature of a KL leash that is too loose for the learning rate.
collapse_guard:
  min_chosen_reward: -3.0
  max_logp_drop: 60.0
